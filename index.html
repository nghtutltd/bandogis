<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>WebGIS GeoServer</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; font-family: Arial; }
        h2 { padding: 10px; margin: 0; background: #f0f0f0; }
        #map { height: calc(100vh - 50px); }
    </style>
</head>

<body>
    <h2>🌍 WebGIS thủy lợi Bình Định</h2>
    <div id="map"></div>

<script>
/* =============================
   🔥 CHỈ CẦN SỬA CHỖ NÀY KHI ĐỔI LINK
============================= */
const GEOSERVER_URL = "https://experiences-clean-sides-sort.trycloudflare.com/geoserver";
const WORKSPACE = "thanhhoa";
const LAYER_NAME = "kc"; // layer dùng để click

/* =============================
   1. Khởi tạo bản đồ
============================= */
var map = L.map('map').setView([13.875, 109.1275], 15);

/* =============================
   2. Base map
============================= */
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
}).addTo(map);

/* =============================
   3. WMS layer từ GeoServer
============================= */
var wmsLayer = L.tileLayer.wms(GEOSERVER_URL + "/wms", {
    layers: WORKSPACE + ":cong_trinh," +
            WORKSPACE + ":diem_gnn," +
            WORKSPACE + ":diem_gnn1," +
            WORKSPACE + ":kc," +
            WORKSPACE + ":khu_tuoi",
    format: 'image/png',
    transparent: true
}).addTo(map);

/* =============================
   4. Click lấy thông tin (GetFeatureInfo)
============================= */
map.on('click', function (e) {

    var point = map.latLngToContainerPoint(e.latlng);
    var size = map.getSize();

    var url = GEOSERVER_URL + "/wms?" +
        "SERVICE=WMS&VERSION=1.1.1&REQUEST=GetFeatureInfo" +
        "&LAYERS=" + WORKSPACE + ":" + LAYER_NAME +
        "&QUERY_LAYERS=" + WORKSPACE + ":" + LAYER_NAME +
        "&BBOX=" + map.getBounds().toBBoxString() +
        "&FEATURE_COUNT=1" +
        "&HEIGHT=" + size.y +
        "&WIDTH=" + size.x +
        "&FORMAT=image/png" +
        "&INFO_FORMAT=application/json" +
        "&SRS=EPSG:4326" +
        "&X=" + Math.round(point.x) +
        "&Y=" + Math.round(point.y);

    fetch(url)
    .then(res => res.json())
    .then(data => {

        if (data.features && data.features.length > 0) {

            var p = data.features[0].properties;

            var content = `
                <div style="min-width:180px">
                    <b style="color:blue">Thông tin:</b><hr>
                    <b>Tên:</b> ${p.Name || p.name || "Không có"}<br>
                    <b>Chiều dài:</b> ${p.dai || "---"}<br>
                    <b>MC ngang:</b> ${p.mcngang || "---"}<br>
                    <b>Năm XD:</b> ${p.namxd || "---"}
                </div>
            `;

            L.popup()
                .setLatLng(e.latlng)
                .setContent(content)
                .openOn(map);
        }
    })
    .catch(err => console.error("Lỗi:", err));
});
</script>

</body>
</html>
